<title>Amlan Sarkar — Full-stack × AI systems engineer</title>
<style>
@media (prefers-reduced-motion: reduce){ .a{animation:none !important} }
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.blink{animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.up{opacity:1;animation:up .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{opacity:1;animation:fade .6s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}

.sweep{transform-origin:40px 0;transform:scaleX(1);animation:sweep .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
